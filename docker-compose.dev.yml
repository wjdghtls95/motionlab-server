services:
  # ========================================
  # MySQL
  # ========================================
  mysql:
    image: mysql:8.0
    container_name: motionlab-mysql
    ports:
      - "3306:3306"
    env_file:
      - ./environments/.env.local
    environment:
      # 기본값 제거 environments/.env.local 에서 필수로 읽어옴
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      # 데이터 영속성 (컨테이너 삭제 후에도 데이터 유지)
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - motionlab-network
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # Redis 7 (캐시 + BullMQ 큐)
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: motionlab-redis
    ports:
      - "6379:6379"
    volumes:
      # 데이터 영속성
     - redis_data:/data
    networks:
      - motionlab-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # MongoDB 7 (AI 분석 결과 저장)
  # - 로컬 개발용: 인증 없이 사용
  # - 프로덕션: MongoDB Atlas (외부 SaaS) 사용 예정
  # ========================================
  mongodb:
    image: mongo:7
    container_name: motionlab-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - motionlab-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

# ========================================
# 볼륨 정의 (데이터 영속성)
# ========================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  mongodb_data:
    driver: local

# ========================================
# 네트워크 정의
# ========================================
networks:
  motionlab-network:
    driver: bridge
